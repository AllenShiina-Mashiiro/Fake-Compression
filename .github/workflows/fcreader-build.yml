name: fcreader-build

on:
  push:
    branches: [fcreader]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Reader dependencies
        run: python -m pip install -r requirements-fcreader.txt
      - name: Build standalone Reader
        run: pyinstaller --clean --noconfirm fcreader.spec
      - name: Upload Reader executable
        uses: actions/upload-artifact@v4
        with:
          name: FCKey-Reader-Windows
          path: dist/FCKey-Reader.exe
          if-no-files-found: error
