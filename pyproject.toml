[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fc-key-reader"
version = "1.0.0"
description = "Standalone FCKey metadata reader"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.8,<7", "cryptography>=44,<47"]

[tool.pytest.ini_options]
testpaths = ["tests"]
