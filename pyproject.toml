[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fake-compression"
version = "0.1.0"
description = "Encrypted split archive desktop utility"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.8,<7", "cryptography>=44,<47"]

[project.scripts]
fake-compression = "fake_compression.app:main"

[tool.setuptools.packages.find]
where = ["src"]
